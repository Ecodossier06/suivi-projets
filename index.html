<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Suivi Projets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#0f172a;--mut:#64748b;--line:#e5e7eb;--acc:#4f46e5;--acc2:#eef2ff;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--r:14px;--sh:0 1px 2px rgba(15,23,42,.04),0 4px 16px rgba(15,23,42,.06)}
@media (prefers-color-scheme:dark){:root{--bg:#0b0f19;--card:#121826;--ink:#e5e7eb;--mut:#94a3b8;--line:#1f2937;--acc:#818cf8;--acc2:#1e1b4b;--sh:0 1px 2px rgba(0,0,0,.3)}}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
a{color:var(--acc);text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--acc)}
.btn.p{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn.g{border:none;background:none;color:var(--mut);padding:6px}
.btn.d{color:var(--bad)}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc2)}
textarea{resize:vertical;min-height:110px;line-height:1.5}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.top{display:flex;align-items:center;gap:12px;height:62px}
.logo{font-weight:700;font-size:17px;display:flex;align-items:center;gap:8px}
.logo i{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--acc),#06b6d4);display:inline-block}
.sp{flex:1}
.who{color:var(--mut);font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:24px 0 16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh)}
.kpi b{font-size:24px;display:block}.kpi span{color:var(--mut);font-size:12px}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.bar input{max-width:280px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;cursor:pointer;font-size:13px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;padding-bottom:40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh);cursor:pointer;transition:.15s;display:flex;flex-direction:column;gap:10px}
.card:hover{transform:translateY(-2px);border-color:var(--acc)}
.card h3{margin:0;font-size:16px}
.card p{margin:0;color:var(--mut);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--mut)}
.badge{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px}
.s-idee{background:#f1f5f9;color:#475569}.s-en_cours{background:#e0e7ff;color:#4338ca}.s-en_pause{background:#fef3c7;color:#92400e}.s-bloque{background:#fee2e2;color:#b91c1c}.s-termine{background:#dcfce7;color:#15803d}
.prio-haute{color:var(--bad);font-weight:600}
.prog{height:6px;background:var(--line);border-radius:9px;overflow:hidden}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),#06b6d4);border-radius:9px}
.next{font-size:13px;background:var(--acc2);border-radius:9px;padding:8px 10px}
.empty{text-align:center;color:var(--mut);padding:60px 0}
/* détail */
#detail{position:fixed;inset:0;background:rgba(15,23,42,.35);display:none;z-index:10;justify-content:flex-end}
#detail.on{display:flex}
.panel{width:min(860px,100%);height:100%;background:var(--bg);overflow:auto;box-shadow:-10px 0 40px rgba(0,0,0,.15);animation:sl .2s}
@keyframes sl{from{transform:translateX(40px);opacity:0}}
.ph{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:14px 22px;display:flex;gap:10px;align-items:center;z-index:2}
.ph input{font-size:19px;font-weight:700;border:none;background:none;padding:4px 0}
.ph input:focus{box-shadow:none}
.pb{padding:20px 22px;display:grid;gap:16px}
.row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
label{font-size:12px;color:var(--mut);display:block;margin-bottom:4px;font-weight:500}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.box h4{margin:0 0 12px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);display:flex;justify-content:space-between}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.li:last-child{border:none}
.li .t{flex:1;min-width:0;overflow-wrap:anywhere}
.li small{color:var(--mut)}
.li .x{opacity:0}.li:hover .x{opacity:1}
.done .t{text-decoration:line-through;color:var(--mut)}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--acc)}
.add{display:flex;gap:8px;margin-top:10px}
.feed .it{border-left:2px solid var(--acc);padding:2px 0 12px 12px;margin-left:4px}
.feed .it small{color:var(--mut)}
.feed .it div{white-space:pre-wrap;margin-top:3px}
.save{font-size:12px;color:var(--ok);opacity:0;transition:.3s}.save.on{opacity:1}
/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:20px}
.lg{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:32px;width:100%;max-width:380px;box-shadow:var(--sh);text-align:center}
.lg h1{margin:12px 0 4px;font-size:22px}.lg p{color:var(--mut);margin:0 0 20px}
.lg form{display:grid;gap:10px}
.hide{display:none!important}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;opacity:0;transition:.3s;z-index:20;pointer-events:none}
#toast.on{opacity:1}
@media(max-width:720px){.kpis{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:1fr 1fr}.cols{grid-template-columns:1fr}.bar input{max-width:none}.who{display:none}}
</style>
</head>
<body>

<div id="login" class="hide">
  <div class="lg">
    <div class="logo" style="justify-content:center"><i></i></div>
    <h1>Suivi Projets</h1>
    <p id="lgmsg">Connexion par lien envoyé par email</p>
    <form id="lgf">
      <input type="email" id="lgmail" placeholder="email@entreprise.fr" required>
      <button class="btn p">Recevoir le lien</button>
    </form>
  </div>
</div>

<div id="app" class="hide">
  <header><div class="wrap top">
    <div class="logo"><i></i>Suivi Projets</div><div class="sp"></div>
    <span class="who" id="who"></span>
    <button class="btn p" id="newp">+ Projet</button>
    <button class="btn g" id="out" title="Déconnexion">⏻</button>
  </div></header>
  <main class="wrap">
    <div class="kpis" id="kpis"></div>
    <div class="bar">
      <input id="q" placeholder="Rechercher…">
      <div class="chips" id="chips"></div>
    </div>
    <div class="grid" id="grid"></div>
  </main>
</div>

<div id="detail"><div class="panel" id="panel"></div></div>
<div id="toast"></div>

<script>
const SB_URL='https://zetvzayuoaehzwjrqjgd.supabase.co';
const SB_KEY='sb_publishable_fhce2NY2VkYMb7noNpwb-A_F8UZYA5Q'; // clé publique, sécurité assurée par RLS
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ST={idee:'Idée',en_cours:'En cours',en_pause:'En pause',bloque:'Bloqué',termine:'Terminé'};
const PR={basse:'Basse',normale:'Normale',haute:'Haute'};
const fd=d=>d?new Date(d).toLocaleDateString('fr-FR',{day:'2-digit',month:'short'}):'';
const fdt=d=>new Date(d).toLocaleString('fr-FR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
const ago=d=>{const m=(Date.now()-new Date(d))/6e4;return m<60?`il y a ${Math.max(1,m|0)} min`:m<1440?`il y a ${m/60|0} h`:`il y a ${m/1440|0} j`};
let P=[],T=[],filt='actifs',cur=null;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2200)}
function err(e){if(e){console.error(e);toast('Erreur : '+(e.message||e));return true}}

// ---------- AUTH
$('#lgf').onsubmit=async e=>{
  e.preventDefault();
  const {error}=await sb.auth.signInWithOtp({email:$('#lgmail').value.trim().toLowerCase(),options:{emailRedirectTo:location.origin+location.pathname}});
  $('#lgmsg').textContent=error?error.message:'Lien envoyé ✓ Vérifie ta boîte mail.';
};
$('#out').onclick=async()=>{await sb.auth.signOut();location.reload()};
sb.auth.onAuthStateChange((ev,s)=>{if(ev==='SIGNED_IN'||ev==='INITIAL_SESSION')boot(s)});

async function boot(s){
  if(!s){$('#login').classList.remove('hide');$('#app').classList.add('hide');return}
  const {data:ok}=await sb.rpc('sp_is_member');
  if(!ok){$('#login').classList.remove('hide');$('#lgf').classList.add('hide');$('#lgmsg').textContent=`${s.user.email} n'a pas accès. Demande à être ajouté.`;return}
  $('#login').classList.add('hide');$('#app').classList.remove('hide');
  $('#who').textContent=s.user.email;
  await load();
  if(location.hash.startsWith('#p/'))open(location.hash.slice(3));
}

// ---------- LISTE
async function load(){
  const [a,b]=await Promise.all([
    sb.from('sp_projects').select('*').order('updated_at',{ascending:false}),
    sb.from('sp_tasks').select('project_id,libelle,fait,echeance,created_at').eq('fait',false).order('created_at')
  ]);
  if(err(a.error)||err(b.error))return;
  P=a.data;T=b.data;render();
}
function render(){
  const c=k=>P.filter(p=>p.statut===k).length;
  $('#kpis').innerHTML=[['Projets actifs',P.filter(p=>p.statut!=='termine').length],['En cours',c('en_cours')],['Bloqués',c('bloque')],['Terminés',c('termine')]]
    .map(([l,n])=>`<div class="kpi"><b>${n}</b><span>${l}</span></div>`).join('');
  const F={actifs:'Actifs',tous:'Tous',...ST};
  $('#chips').innerHTML=Object.entries(F).map(([k,l])=>`<span class="chip ${filt===k?'on':''}" data-f="${k}">${l}</span>`).join('');
  const q=$('#q').value.toLowerCase();
  const L=P.filter(p=>(filt==='tous'||(filt==='actifs'?p.statut!=='termine':p.statut===filt))&&(!q||(p.titre+' '+(p.synthese||'')).toLowerCase().includes(q)));
  $('#grid').innerHTML=L.length?L.map(p=>{
    const n=T.find(t=>t.project_id===p.id);
    return `<div class="card" data-id="${p.id}">
      <div class="meta"><span class="badge s-${p.statut}">${ST[p.statut]}</span>${p.priorite==='haute'?'<span class="prio-haute">● Prioritaire</span>':''}<span class="sp"></span>${p.echeance?'📅 '+fd(p.echeance):''}</div>
      <h3>${esc(p.titre)}</h3>${p.synthese?`<p>${esc(p.synthese)}</p>`:''}
      ${n?`<div class="next">→ ${esc(n.libelle)}</div>`:''}
      <div class="prog"><i style="width:${p.avancement}%"></i></div>
      <div class="meta"><span>${p.avancement}%</span><span class="sp"></span><span>MAJ ${ago(p.updated_at)}</span></div>
    </div>`}).join(''):`<div class="empty">Aucun projet</div>`;
}
$('#chips').onclick=e=>{const f=e.target.dataset.f;if(f){filt=f;render()}};
$('#q').oninput=render;
$('#grid').onclick=e=>{const c=e.target.closest('.card');if(c)open(c.dataset.id)};
$('#newp').onclick=async()=>{
  const {data,error}=await sb.from('sp_projects').insert({titre:'Nouveau projet'}).select().single();
  if(err(error))return;P.unshift(data);render();open(data.id);setTimeout(()=>$('#f_titre')?.select(),50);
};

// ---------- DÉTAIL
async function open(id){
  cur=id;location.hash='p/'+id;$('#detail').classList.add('on');
  const [p,t,l,d,u]=await Promise.all([
    sb.from('sp_projects').select('*').eq('id',id).single(),
    sb.from('sp_tasks').select('*').eq('project_id',id).order('created_at'),
    sb.from('sp_links').select('*').eq('project_id',id).order('created_at'),
    sb.from('sp_docs').select('*').eq('project_id',id).order('created_at',{ascending:false}),
    sb.from('sp_updates').select('*').eq('project_id',id).order('created_at',{ascending:false})
  ]);
  if(err(p.error))return close();
  const x=p.data,todo=t.data.filter(i=>!i.fait),done=t.data.filter(i=>i.fait).sort((a,b)=>new Date(b.fait_le)-new Date(a.fait_le));
  const opt=(o,v)=>Object.entries(o).map(([k,l])=>`<option value="${k}" ${k===v?'selected':''}>${l}</option>`).join('');
  const task=i=>`<div class="li ${i.fait?'done':''}"><input type="checkbox" data-tk="${i.id}" ${i.fait?'checked':''}><span class="t">${esc(i.libelle)}${i.fait?` <small>· ${fd(i.fait_le)}</small>`:i.echeance?` <small>· 📅 ${fd(i.echeance)}</small>`:''}</span><button class="btn g x" data-del="sp_tasks:${i.id}">✕</button></div>`;
  $('#panel').innerHTML=`
  <div class="ph"><input id="f_titre" value="${esc(x.titre)}"><span class="save" id="sv">Enregistré ✓</span><button class="btn g" id="cls" style="font-size:20px">✕</button></div>
  <div class="pb">
    <div class="row">
      <div><label>Statut</label><select id="f_statut">${opt(ST,x.statut)}</select></div>
      <div><label>Priorité</label><select id="f_priorite">${opt(PR,x.priorite)}</select></div>
      <div><label>Échéance</label><input type="date" id="f_echeance" value="${x.echeance||''}"></div>
      <div><label>Avancement <b id="av">${x.avancement}%</b></label><input type="range" id="f_avancement" min="0" max="100" step="5" value="${x.avancement}" style="padding:9px 0;border:none"></div>
    </div>
    <div class="box"><h4>Synthèse / cadrage</h4><textarea id="f_synthese" placeholder="Contexte, objectifs, périmètre, enjeux…">${esc(x.synthese)}</textarea></div>
    <div class="cols">
      <div class="box"><h4>Prochaines étapes <span>${todo.length}</span></h4>${todo.map(task).join('')||'<small style="color:var(--mut)">Rien de prévu</small>'}
        <form class="add" data-add="task"><input name="libelle" placeholder="Nouvelle étape" required><input name="echeance" type="date" style="width:150px"><button class="btn">+</button></form></div>
      <div class="box"><h4>Déjà fait <span>${done.length}</span></h4>${done.map(task).join('')||'<small style="color:var(--mut)">—</small>'}</div>
    </div>
    <div class="cols">
      <div class="box"><h4>Liens</h4>${l.data.map(i=>`<div class="li"><span class="t">🔗 <a href="${esc(i.url)}" target="_blank" rel="noopener noreferrer">${esc(i.titre)}</a></span><button class="btn g x" data-del="sp_links:${i.id}">✕</button></div>`).join('')}
        <form class="add" data-add="link"><input name="titre" placeholder="Titre" required><input name="url" type="url" placeholder="https://…" required><button class="btn">+</button></form></div>
      <div class="box"><h4>Documents</h4>${d.data.map(i=>`<div class="li"><span class="t">📄 <a href="#" data-dl="${esc(i.path)}">${esc(i.nom)}</a> <small>· ${fd(i.created_at)}</small></span><button class="btn g x" data-deldoc="${i.id}" data-path="${esc(i.path)}">✕</button></div>`).join('')}
        <label class="btn" style="display:inline-block;margin-top:10px;color:inherit;font-size:14px">⬆ Ajouter des fichiers<input type="file" id="up" multiple hidden></label></div>
    </div>
    <div class="box feed"><h4>Journal</h4>
      <form class="add" data-add="update" style="margin:0 0 14px"><input name="contenu" placeholder="Point d'avancement, décision, remarque…" required><button class="btn p">Publier</button></form>
      ${u.data.map(i=>`<div class="it"><small>${esc(i.auteur)} · ${fdt(i.created_at)}</small><div>${esc(i.contenu)}</div></div>`).join('')||'<small style="color:var(--mut)">Aucune entrée</small>'}
    </div>
    <div><button class="btn d" id="delp">Supprimer le projet</button></div>
  </div>`;
  bind(x);
}
function close(){$('#detail').classList.remove('on');cur=null;history.replaceState(null,'',location.pathname);load()}
$('#detail').onclick=e=>{if(e.target.id==='detail')close()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&cur)close()});

let tmr;
async function patch(f,v){
  const {error}=await sb.from('sp_projects').update({[f]:v}).eq('id',cur);
  if(err(error))return;const s=$('#sv');s.classList.add('on');setTimeout(()=>s.classList.remove('on'),1200);
}
function bind(x){
  $('#cls').onclick=close;
  ['titre','synthese'].forEach(f=>$('#f_'+f).oninput=e=>{clearTimeout(tmr);tmr=setTimeout(()=>patch(f,e.target.value.trim()||(f==='titre'?'Sans titre':null)),600)});
  ['statut','priorite','echeance'].forEach(f=>$('#f_'+f).onchange=e=>patch(f,e.target.value||null));
  $('#f_avancement').oninput=e=>$('#av').textContent=e.target.value+'%';
  $('#f_avancement').onchange=e=>patch('avancement',+e.target.value);
  $('#delp').onclick=async()=>{
    if(!confirm('Supprimer définitivement ce projet ?'))return;
    const {data:docs}=await sb.from('sp_docs').select('path').eq('project_id',cur);
    if(docs?.length)await sb.storage.from('sp-docs').remove(docs.map(d=>d.path));
    if(!err((await sb.from('sp_projects').delete().eq('id',cur)).error))close();
  };
  $('#up').onchange=async e=>{
    for(const f of e.target.files){
      const path=`${cur}/${crypto.randomUUID()}-${f.name.replace(/[^\w.\-]/g,'_')}`;
      const up=await sb.storage.from('sp-docs').upload(path,f);
      if(err(up.error))continue;
      await sb.from('sp_docs').insert({project_id:cur,nom:f.name,path,taille:f.size});
    }
    toast('Fichiers ajoutés');open(cur);
  };
}
$('#panel').addEventListener('submit',async e=>{
  e.preventDefault();const f=Object.fromEntries(new FormData(e.target));for(const k in f)if(!f[k])delete f[k];
  const tb={task:'sp_tasks',link:'sp_links',update:'sp_updates'}[e.target.dataset.add];
  if(!err((await sb.from(tb).insert({...f,project_id:cur})).error))open(cur);
});
$('#panel').addEventListener('change',async e=>{
  const id=e.target.dataset.tk;if(!id)return;
  if(!err((await sb.from('sp_tasks').update({fait:e.target.checked}).eq('id',id)).error))open(cur);
});
$('#panel').addEventListener('click',async e=>{
  const t=e.target;
  if(t.dataset.del){const [tb,id]=t.dataset.del.split(':');if(!err((await sb.from(tb).delete().eq('id',id)).error))open(cur)}
  if(t.dataset.deldoc){if(!confirm('Supprimer ce document ?'))return;await sb.storage.from('sp-docs').remove([t.dataset.path]);if(!err((await sb.from('sp_docs').delete().eq('id',t.dataset.deldoc)).error))open(cur)}
  if(t.dataset.dl){e.preventDefault();const {data,error}=await sb.storage.from('sp-docs').createSignedUrl(t.dataset.dl,120);if(!err(error))window.open(data.signedUrl,'_blank','noopener')}
});
</script>
</body>
</html>
