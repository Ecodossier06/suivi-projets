<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Suivi Projets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{color-scheme:dark;--bg:#0a0a12;--card:#13121d;--ink:#ece9f5;--mut:#9b96b0;--line:#25223a;--acc:#8b5cf6;--acc2:rgba(139,92,246,.14);--gold:#d4af6a;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--r:14px;--sh:0 1px 0 rgba(255,255,255,.03) inset,0 8px 24px rgba(0,0,0,.35)}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
a{color:var(--acc);text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--acc)}
.btn.p{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn.g{border:none;background:none;color:var(--mut);padding:6px}
.btn.d{color:var(--bad)}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc2)}
textarea{resize:vertical;min-height:110px;line-height:1.5}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.top{display:flex;align-items:center;gap:12px;height:62px}
.logo{font-weight:700;font-size:17px;display:flex;align-items:center;gap:8px}
.logo i{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--acc),#06b6d4);display:inline-block}
.sp{flex:1}
.who{color:var(--mut);font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:24px 0 16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh)}
.kpi b{font-size:24px;display:block}.kpi span{color:var(--mut);font-size:12px}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.bar input{max-width:280px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;cursor:pointer;font-size:13px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;padding-bottom:40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh);cursor:pointer;transition:.15s;display:flex;flex-direction:column;gap:10px}
.card:hover{transform:translateY(-2px);border-color:var(--acc)}
.card h3{margin:0;font-size:16px}
.card p{margin:0;color:var(--mut);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--mut)}
.badge{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px}
.s-idee{background:rgba(155,150,176,.15);color:#c4c0d6}.s-en_cours{background:rgba(139,92,246,.18);color:#c4b5fd}.s-en_pause{background:rgba(212,175,106,.16);color:#e6c98f}.s-bloque{background:rgba(248,113,113,.15);color:#fca5a5}.s-termine{background:rgba(74,222,128,.13);color:#86efac}
.prio-haute{color:var(--bad);font-weight:600}
.prog{height:6px;background:var(--line);border-radius:9px;overflow:hidden}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--gold));border-radius:9px}
.chip.on{background:linear-gradient(120deg,var(--acc),#6d28d9);color:#fff;border-color:transparent}
.btn.p{background:linear-gradient(120deg,#8b5cf6,#6d28d9);border:none;color:#fff}
.logo i{background:conic-gradient(from 200deg,var(--gold),var(--acc),#3b0764,var(--gold))!important}
.card:hover{border-color:rgba(212,175,106,.45);box-shadow:0 10px 30px rgba(139,92,246,.15)}
.next{color:#ddd6fe}
.next{font-size:13px;background:var(--acc2);border-radius:9px;padding:8px 10px}
.empty{text-align:center;color:var(--mut);padding:60px 0}
/* détail */
#detail{position:fixed;inset:0;background:rgba(15,23,42,.35);display:none;z-index:10;justify-content:flex-end}
#detail.on{display:flex}
.panel{width:min(860px,100%);height:100%;background:var(--bg);overflow:auto;box-shadow:-10px 0 40px rgba(0,0,0,.15);animation:sl .2s}
@keyframes sl{from{transform:translateX(40px);opacity:0}}
.ph{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:14px 22px;display:flex;gap:10px;align-items:center;z-index:2}
.ph input{font-size:19px;font-weight:700;border:none;background:none;padding:4px 0}
.ph input:focus{box-shadow:none}
.pb{padding:20px 22px;display:grid;gap:16px}
.row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
label{font-size:12px;color:var(--mut);display:block;margin-bottom:4px;font-weight:500}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.box h4{margin:0 0 12px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);display:flex;justify-content:space-between}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.li:last-child{border:none}
.li .t{flex:1;min-width:0;overflow-wrap:anywhere}
.li small{color:var(--mut)}
.li .x{opacity:0}.li:hover .x{opacity:1}
.done .t{text-decoration:line-through;color:var(--mut)}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--acc)}
.add{display:flex;gap:8px;margin-top:10px}
.feed .it{border-left:2px solid var(--acc);padding:2px 0 12px 12px;margin-left:4px}
.feed .it small{color:var(--mut)}
.feed .it div{white-space:pre-wrap;margin-top:3px}
.save{font-size:12px;color:var(--ok);opacity:0;transition:.3s}.save.on{opacity:1}
/* fond */
body{background:radial-gradient(1100px 600px at 0% -10%,rgba(139,92,246,.14),transparent 60%),radial-gradient(800px 500px at 110% 0%,rgba(212,175,106,.08),transparent 60%),var(--bg);background-attachment:fixed}
.hero{margin-top:22px;border-radius:20px;padding:28px 30px;color:#fff;position:relative;overflow:hidden;isolation:isolate;border:1px solid rgba(212,175,106,.25);
  background:linear-gradient(135deg,#1e1033,#4c1d95,#2a1650,#6d28d9,#1e1033);background-size:300% 300%;animation:wave 14s ease-in-out infinite;box-shadow:0 14px 40px rgba(76,29,149,.35)}
.hero:before{content:"";position:absolute;inset:-60%;z-index:-1;background:conic-gradient(from 0deg,transparent 0 55%,rgba(212,175,106,.35) 65%,rgba(167,139,250,.35) 75%,transparent 85%);animation:spin 12s linear infinite;filter:blur(30px)}
.hero:after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(255,255,255,.06),transparent 50%)}
.hero h2{margin:0 0 6px;font-size:24px;letter-spacing:-.01em}.hero p{margin:0;color:#e9d9b4}
@keyframes wave{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.hero,.hero:before{animation:none}}
.kpi{position:relative;overflow:hidden}.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--acc))}
/* login */
#login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.lside{position:relative;overflow:hidden;color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(135deg,#0f0a1e,#3b0764 50%,#1e1033);background-size:300% 300%;animation:wave 16s ease-in-out infinite;border-right:1px solid rgba(212,175,106,.2)}
.lside:before{content:"";position:absolute;inset:-50%;background:conic-gradient(from 0deg,transparent 0 55%,rgba(212,175,106,.25) 65%,rgba(167,139,250,.3) 75%,transparent 85%);animation:spin 18s linear infinite;filter:blur(40px)}
.lside h2 span{background:linear-gradient(90deg,#f3e3bd,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.lside .blob{position:absolute;border-radius:50%;filter:blur(40px);opacity:.55}
.lside h2{font-size:38px;line-height:1.15;margin:0 0 14px;max-width:440px;position:relative}
.lside p{opacity:.85;max-width:400px;margin:0;position:relative;font-size:15px}
.lside .logo{position:relative}.lside .logo i{background:#fff}
.feat{display:flex;gap:10px;flex-wrap:wrap;position:relative}
.feat span{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);padding:7px 12px;border-radius:99px;font-size:13px;backdrop-filter:blur(6px)}
.lmain{display:grid;place-items:center;padding:24px}
.lg{width:100%;max-width:360px}
.lg h1{margin:0 0 6px;font-size:26px}.lg p{color:var(--mut);margin:0 0 24px}
.lg form{display:grid;gap:12px}
.lg input{padding:12px 14px}
.lg .btn.p{padding:12px;box-shadow:0 6px 18px rgba(139,92,246,.3)}
.feat,.lside>div:not(.blob),.lside .logo{z-index:1}
#lgerr{color:var(--bad);font-size:13px;min-height:18px;margin:0}
@media(max-width:820px){#login{grid-template-columns:1fr}.lside{padding:28px;min-height:220px}.lside h2{font-size:26px}}
.hide{display:none!important}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;opacity:0;transition:.3s;z-index:20;pointer-events:none}
#toast.on{opacity:1}
@media(max-width:720px){.kpis{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:1fr 1fr}.cols{grid-template-columns:1fr}.bar input{max-width:none}.who{display:none}}
/* ===== V3 : typo, bandeau, cartes ===== */
h1,h2,h3,.logo,.ph input,.kpi b{font-family:Sora,Inter,sans-serif;letter-spacing:-.02em}
.logo{font-size:18px}
/* bandeau */
.hero{margin-top:26px;padding:38px 40px;border-radius:26px;display:grid;grid-template-columns:1fr auto;gap:30px;align-items:center;min-height:250px}
.hero .eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.18em;color:var(--gold);font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.hero .eyebrow:before{content:"";width:22px;height:1px;background:var(--gold)}
.hero h2{font-size:42px;font-weight:800;line-height:1.05;margin:0 0 10px;background:linear-gradient(90deg,#fff 30%,#f3e3bd 70%,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{font-size:15px;color:#d9cfee}
.hero .kpis{margin:26px 0 0;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.hero .kpi{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(10px);box-shadow:none;padding:12px 14px;border-radius:14px}
.hero .kpi:before{width:auto;height:2px;right:0;bottom:auto;left:14px;right:14px;top:0;border-radius:2px}
.hero .kpi b{font-size:28px;color:#fff}.hero .kpi span{color:#cfc4e6}
.orb{position:absolute;border-radius:50%;filter:blur(2px);z-index:-1;animation:float 9s ease-in-out infinite}
.orb.a{width:14px;height:14px;background:var(--gold);top:22%;right:34%;box-shadow:0 0 24px 6px rgba(212,175,106,.6)}
.orb.b{width:8px;height:8px;background:#c4b5fd;bottom:20%;right:44%;animation-delay:-3s;box-shadow:0 0 18px 4px rgba(196,181,253,.6)}
.orb.c{width:6px;height:6px;background:#fff;top:14%;left:48%;animation-delay:-6s;box-shadow:0 0 14px 3px rgba(255,255,255,.5)}
@keyframes float{0%,100%{transform:translate(0,0)}33%{transform:translate(18px,-14px)}66%{transform:translate(-12px,10px)}}
.ring{position:relative;width:170px;height:170px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);filter:drop-shadow(0 0 18px rgba(212,175,106,.35))}
.ring circle{fill:none;stroke-width:10}
.ring .bg{stroke:rgba(255,255,255,.1)}
.ring .fg{stroke:url(#rg);stroke-linecap:round;stroke-dasharray:440;stroke-dashoffset:440;transition:stroke-dashoffset 1.4s cubic-bezier(.2,.8,.2,1)}
.ring div{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring b{font-family:Sora,Inter,sans-serif;font-size:34px;font-weight:800;color:#fff}.ring span{font-size:11px;color:#cfc4e6;text-transform:uppercase;letter-spacing:.12em}
/* section */
.sec{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:38px 0 18px}
.sec h2{margin:0;font-size:26px;font-weight:700}.sec h2 small{font-family:Inter;font-size:14px;color:var(--mut);font-weight:500;margin-left:8px}
.sec .bar{margin:0;flex-wrap:nowrap;align-items:center}.sec .bar input{width:200px;flex:none}
.bar input{background:rgba(255,255,255,.03);border-radius:99px;padding:9px 16px}
.chip{background:rgba(255,255,255,.03)}
/* cartes */
.grid{gap:18px;grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
.card{--x:50%;--y:0%;position:relative;padding:22px;gap:12px;border-radius:20px;border:1px solid transparent;
  background:radial-gradient(400px circle at var(--x) var(--y),rgba(139,92,246,.12),transparent 45%) padding-box,linear-gradient(160deg,rgba(255,255,255,.05),rgba(255,255,255,.015)) padding-box,linear-gradient(160deg,rgba(255,255,255,.14),rgba(255,255,255,.03) 40%,rgba(212,175,106,.18)) border-box;
  background-color:#100f19;box-shadow:0 20px 40px -20px rgba(0,0,0,.6);transition:transform .25s,box-shadow .25s;animation:in .5s both;animation-delay:calc(var(--i,0)*60ms)}
.card:hover{transform:translateY(-4px);border-color:transparent;box-shadow:0 24px 50px -18px rgba(109,40,217,.45);
  background:radial-gradient(400px circle at var(--x) var(--y),rgba(212,175,106,.14),transparent 45%) padding-box,linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.02)) padding-box,linear-gradient(160deg,rgba(212,175,106,.6),rgba(139,92,246,.4) 50%,rgba(212,175,106,.3)) border-box;background-color:#100f19}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
.card h3{font-size:19px;font-weight:700;line-height:1.25}
.card p{font-size:13.5px;line-height:1.55}
.card .top2{display:flex;align-items:center;gap:8px}
.card .pct{margin-left:auto;font-family:Sora,Inter,sans-serif;font-weight:700;font-size:15px;color:var(--gold)}
.next{background:rgba(139,92,246,.1);border:1px solid rgba(139,92,246,.2);border-radius:12px;padding:10px 12px;font-size:13px;display:flex;gap:8px}
.next em{font-style:normal;color:var(--gold);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.08em;white-space:nowrap;padding-top:1px}
.prog{height:5px;background:rgba(255,255,255,.07)}
.prog i{box-shadow:0 0 12px rgba(212,175,106,.5)}
.card .foot{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);border-top:1px solid rgba(255,255,255,.06);padding-top:12px;margin-top:2px}
@media(max-width:820px){.sec .bar{flex-wrap:wrap}.sec .bar input{width:100%}.hero{grid-template-columns:1fr;padding:28px 22px}.hero h2{font-size:32px}.ring{display:none}.hero .kpis{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:reduce){.orb,.card{animation:none}}
/* galerie */
.gal{position:relative}
.gal .main{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#07060c;border:1px solid var(--line)}
.gal .main img{width:100%;height:100%;object-fit:contain;cursor:zoom-in;animation:fade .35s}
@keyframes fade{from{opacity:0;transform:scale(.98)}}
.gal .nav,#lb .nav{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(10,10,18,.6);backdrop-filter:blur(8px);color:#fff;font-size:20px;cursor:pointer;display:grid;place-items:center}
.gal .nav:hover,#lb .nav:hover{border-color:var(--gold)}.gal .prev,#lb .prev{left:12px}.gal .next2,#lb .next2{right:12px}
.gal .cap{position:absolute;left:0;right:0;bottom:0;padding:24px 14px 10px;background:linear-gradient(transparent,rgba(0,0,0,.75));font-size:12.5px;display:flex;justify-content:space-between;gap:10px}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding:10px 2px 2px;scroll-snap-type:x mandatory}
.thumbs img{width:84px;height:56px;object-fit:cover;border-radius:9px;cursor:pointer;opacity:.5;border:2px solid transparent;scroll-snap-align:start;flex:none;transition:.2s}
.thumbs img.on{opacity:1;border-color:var(--gold)}.thumbs img:hover{opacity:.9}
#lb{position:fixed;inset:0;z-index:30;background:rgba(5,4,10,.94);display:none;place-items:center;padding:30px}
#lb.on{display:grid}#lb img{max-width:100%;max-height:90vh;border-radius:10px;animation:fade .3s}
#lb .nav{position:fixed;width:48px;height:48px}
</style>
</head>
<body>

<div id="login" class="hide">
  <div class="lside">
    <div class="blob" style="width:320px;height:320px;background:#7c3aed;left:-80px;bottom:-80px"></div>
    <div class="blob" style="width:220px;height:220px;background:#d4af6a;right:-60px;top:40px;opacity:.25"></div>
    <div class="logo"><i></i>Suivi Projets</div>
    <div><h2>Tous les projets, <span>au même endroit.</span></h2><p>Synthèses, documents de cadrage, prochaines étapes et avancement partagés en temps réel.</p></div>
    <div class="feat"><span>📋 Cadrage</span><span>✅ Étapes</span><span>📎 Documents</span><span>📈 Avancement</span></div>
  </div>
  <div class="lmain"><div class="lg">
    <h1>Connexion</h1>
    <p id="lgmsg">Accès réservé</p>
    <form id="lgf">
      <input type="email" id="lgmail" placeholder="Email" autocomplete="username" required>
      <input type="password" id="lgpw" placeholder="Mot de passe" autocomplete="current-password" required>
      <p id="lgerr"></p>
      <button class="btn p">Se connecter</button>
    </form>
  </div></div>
</div>

<div id="app" class="hide">
  <header><div class="wrap top">
    <div class="logo"><i></i>Suivi Projets</div><div class="sp"></div>
    <span class="who" id="who"></span>
    <button class="btn p" id="newp">+ Projet</button>
    <button class="btn g" id="pw" title="Changer mon mot de passe">🔑</button>
    <button class="btn g" id="out" title="Déconnexion">⏻</button>
  </div></header>
  <main class="wrap">
    <div class="hero">
      <i class="orb a"></i><i class="orb b"></i><i class="orb c"></i>
      <div>
        <div class="eyebrow" id="hdate"></div>
        <h2 id="hello">Bonjour</h2><p id="hsub"></p>
        <div class="kpis" id="kpis"></div>
      </div>
      <div class="ring">
        <svg viewBox="0 0 160 160"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#d4af6a"/></linearGradient></defs>
          <circle class="bg" cx="80" cy="80" r="70"/><circle class="fg" id="ringfg" cx="80" cy="80" r="70"/></svg>
        <div><b id="ringv">0%</b><span>Moyenne</span></div>
      </div>
    </div>
    <div class="sec">
      <h2>Projets <small id="cnt"></small></h2>
      <div class="bar"><input id="q" placeholder="Rechercher…"><div class="chips" id="chips"></div></div>
    </div>
    <div class="grid" id="grid"></div>
  </main>
</div>

<div id="detail"><div class="panel" id="panel"></div></div>
<div id="toast"></div>
<div id="lb"><button class="nav prev" data-g="-1">‹</button><img id="lbimg" alt=""><button class="nav next2" data-g="1">›</button></div>

<script>
const SB_URL='https://zetvzayuoaehzwjrqjgd.supabase.co';
const SB_KEY='sb_publishable_fhce2NY2VkYMb7noNpwb-A_F8UZYA5Q'; // clé publique, sécurité assurée par RLS
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ST={idee:'Idée',en_cours:'En cours',en_pause:'En pause',bloque:'Bloqué',termine:'Terminé'};
const PR={basse:'Basse',normale:'Normale',haute:'Haute'};
const fd=d=>d?new Date(d).toLocaleDateString('fr-FR',{day:'2-digit',month:'short'}):'';
const fdt=d=>new Date(d).toLocaleString('fr-FR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
const ago=d=>{const m=(Date.now()-new Date(d))/6e4;return m<60?`il y a ${Math.max(1,m|0)} min`:m<1440?`il y a ${m/60|0} h`:`il y a ${m/1440|0} j`};
let P=[],T=[],filt='actifs',cur=null;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2200)}
function err(e){if(e){console.error(e);toast('Erreur : '+(e.message||e));return true}}

// ---------- AUTH
$('#lgf').onsubmit=async e=>{
  e.preventDefault();$('#lgerr').textContent='';
  const {error}=await sb.auth.signInWithPassword({email:$('#lgmail').value.trim().toLowerCase(),password:$('#lgpw').value});
  if(error)$('#lgerr').textContent='Email ou mot de passe incorrect';
};
$('#pw').onclick=async()=>{
  const p=prompt('Nouveau mot de passe (10 caractères min.)');if(!p)return;
  if(p.length<10)return toast('10 caractères minimum');
  const {error}=await sb.auth.updateUser({password:p});if(!err(error))toast('Mot de passe modifié ✓');
};
$('#out').onclick=async()=>{await sb.auth.signOut();location.reload()};
sb.auth.onAuthStateChange((ev,s)=>{if(ev==='SIGNED_IN'||ev==='INITIAL_SESSION')boot(s)});

async function boot(s){
  if(!s){$('#login').classList.remove('hide');$('#app').classList.add('hide');return}
  const {data:ok}=await sb.rpc('sp_is_member');
  if(!ok){await sb.auth.signOut();$('#login').classList.remove('hide');$('#lgerr').textContent=`${s.user.email} n'a pas accès.`;return}
  $('#login').classList.add('hide');$('#app').classList.remove('hide');
  $('#who').textContent=s.user.email;
  await load();
  if(location.hash.startsWith('#p/'))open(location.hash.slice(3));
}

// ---------- LISTE
async function load(){
  const [a,b]=await Promise.all([
    sb.from('sp_projects').select('*').order('updated_at',{ascending:false}),
    sb.from('sp_tasks').select('project_id,libelle,fait,echeance,created_at').eq('fait',false).order('created_at')
  ]);
  if(err(a.error)||err(b.error))return;
  P=a.data;T=b.data;render();
}
function render(){
  const c=k=>P.filter(p=>p.statut===k).length;
  $('#kpis').innerHTML=[['Projets actifs',P.filter(p=>p.statut!=='termine').length,'#d4af6a'],['En cours',c('en_cours'),'#8b5cf6'],['Bloqués',c('bloque'),'#f87171'],['Terminés',c('termine'),'#4ade80']]
    .map(([l,n,col])=>`<div class="kpi" style="--c:${col}"><b>${n}</b><span>${l}</span></div>`).join('');
  const h=new Date().getHours();
  const act=P.filter(p=>p.statut!=='termine');
  $('#hello').textContent=h<18?'Bonjour.':'Bonsoir.';
  $('#hdate').textContent=new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
  $('#hsub').textContent=`${act.length} projet${act.length>1?'s':''} en vue · ${T.length} étape${T.length>1?'s':''} à venir`;
  const moy=act.length?Math.round(act.reduce((s,p)=>s+p.avancement,0)/act.length):0;
  $('#ringv').textContent=moy+'%';
  requestAnimationFrame(()=>$('#ringfg').style.strokeDashoffset=440-440*moy/100);
  const F={actifs:'Actifs',tous:'Tous',...ST};
  $('#chips').innerHTML=Object.entries(F).map(([k,l])=>`<span class="chip ${filt===k?'on':''}" data-f="${k}">${l}</span>`).join('');
  const q=$('#q').value.toLowerCase();
  const L=P.filter(p=>(filt==='tous'||(filt==='actifs'?p.statut!=='termine':p.statut===filt))&&(!q||(p.titre+' '+(p.synthese||'')).toLowerCase().includes(q)));
  $('#cnt').textContent=L.length;
  $('#grid').innerHTML=L.length?L.map((p,i)=>{
    const n=T.find(t=>t.project_id===p.id);
    return `<div class="card" data-id="${p.id}" style="--i:${i}">
      <div class="top2"><span class="badge s-${p.statut}">${ST[p.statut]}</span>${p.priorite==='haute'?'<span class="prio-haute" style="font-size:12px">● Prioritaire</span>':''}<span class="pct">${p.avancement}%</span></div>
      <h3>${esc(p.titre)}</h3>${p.synthese?`<p>${esc(p.synthese)}</p>`:''}
      ${n?`<div class="next"><em>Suite</em><span>${esc(n.libelle)}</span></div>`:''}
      <div class="prog"><i style="width:${p.avancement}%"></i></div>
      <div class="foot"><span>${p.echeance?'Échéance '+fd(p.echeance):'Sans échéance'}</span><span>MAJ ${ago(p.updated_at)}</span></div>
    </div>`}).join(''):`<div class="empty">Aucun projet</div>`;
}
$('#chips').onclick=e=>{const f=e.target.dataset.f;if(f){filt=f;render()}};
$('#q').oninput=render;
$('#grid').onclick=e=>{const c=e.target.closest('.card');if(c)open(c.dataset.id)};
$('#grid').onmousemove=e=>{const c=e.target.closest('.card');if(!c)return;const r=c.getBoundingClientRect();c.style.setProperty('--x',e.clientX-r.left+'px');c.style.setProperty('--y',e.clientY-r.top+'px')};
$('#newp').onclick=async()=>{
  const {data,error}=await sb.from('sp_projects').insert({titre:'Nouveau projet'}).select().single();
  if(err(error))return;P.unshift(data);render();open(data.id);setTimeout(()=>$('#f_titre')?.select(),50);
};

// ---------- DÉTAIL
async function open(id){
  cur=id;location.hash='p/'+id;$('#detail').classList.add('on');
  const [p,t,l,d,u]=await Promise.all([
    sb.from('sp_projects').select('*').eq('id',id).single(),
    sb.from('sp_tasks').select('*').eq('project_id',id).order('created_at'),
    sb.from('sp_links').select('*').eq('project_id',id).order('created_at'),
    sb.from('sp_docs').select('*').eq('project_id',id).order('created_at',{ascending:false}),
    sb.from('sp_updates').select('*').eq('project_id',id).order('created_at',{ascending:false})
  ]);
  if(err(p.error))return close();
  const isImg=n=>/\.(png|jpe?g|gif|webp|avif|svg)$/i.test(n);
  const imgs=d.data.filter(i=>isImg(i.nom)),files=d.data.filter(i=>!isImg(i.nom));
  GAL=[];gi=0;
  if(imgs.length){const r=await sb.storage.from('sp-docs').createSignedUrls(imgs.map(i=>i.path),3600);GAL=imgs.map((i,k)=>({...i,url:r.data?.[k]?.signedUrl})).filter(i=>i.url)}
  const x=p.data,todo=t.data.filter(i=>!i.fait),done=t.data.filter(i=>i.fait).sort((a,b)=>new Date(b.fait_le)-new Date(a.fait_le));
  const opt=(o,v)=>Object.entries(o).map(([k,l])=>`<option value="${k}" ${k===v?'selected':''}>${l}</option>`).join('');
  const task=i=>`<div class="li ${i.fait?'done':''}"><input type="checkbox" data-tk="${i.id}" ${i.fait?'checked':''}><span class="t">${esc(i.libelle)}${i.fait?` <small>· ${fd(i.fait_le)}</small>`:i.echeance?` <small>· 📅 ${fd(i.echeance)}</small>`:''}</span><button class="btn g x" data-del="sp_tasks:${i.id}">✕</button></div>`;
  $('#panel').innerHTML=`
  <div class="ph"><input id="f_titre" value="${esc(x.titre)}"><span class="save" id="sv">Enregistré ✓</span><button class="btn g" id="cls" style="font-size:20px">✕</button></div>
  <div class="pb">
    <div class="row">
      <div><label>Statut</label><select id="f_statut">${opt(ST,x.statut)}</select></div>
      <div><label>Priorité</label><select id="f_priorite">${opt(PR,x.priorite)}</select></div>
      <div><label>Échéance</label><input type="date" id="f_echeance" value="${x.echeance||''}"></div>
      <div><label>Avancement <b id="av">${x.avancement}%</b></label><input type="range" id="f_avancement" min="0" max="100" step="5" value="${x.avancement}" style="padding:9px 0;border:none"></div>
    </div>
    <div class="box"><h4>Synthèse / cadrage</h4><textarea id="f_synthese" placeholder="Contexte, objectifs, périmètre, enjeux…">${esc(x.synthese)}</textarea></div>
    ${GAL.length?`<div class="box gal"><h4>Images <span>${GAL.length}</span></h4>
      <div class="main"><img id="gimg" alt="">${GAL.length>1?'<button class="nav prev" data-g="-1">‹</button><button class="nav next2" data-g="1">›</button>':''}
        <div class="cap"><span id="gcap"></span><button class="btn g x" style="opacity:1;padding:0;color:#fca5a5" id="gdel">Supprimer</button></div></div>
      ${GAL.length>1?`<div class="thumbs">${GAL.map((g,k)=>`<img src="${esc(g.url)}" data-gi="${k}" alt="" loading="lazy">`).join('')}</div>`:''}
    </div>`:''}
    <div class="cols">
      <div class="box"><h4>Prochaines étapes <span>${todo.length}</span></h4>${todo.map(task).join('')||'<small style="color:var(--mut)">Rien de prévu</small>'}
        <form class="add" data-add="task"><input name="libelle" placeholder="Nouvelle étape" required><input name="echeance" type="date" style="width:150px"><button class="btn">+</button></form></div>
      <div class="box"><h4>Déjà fait <span>${done.length}</span></h4>${done.map(task).join('')||'<small style="color:var(--mut)">—</small>'}</div>
    </div>
    <div class="cols">
      <div class="box"><h4>Liens</h4>${l.data.map(i=>`<div class="li"><span class="t">🔗 <a href="${esc(i.url)}" target="_blank" rel="noopener noreferrer">${esc(i.titre)}</a></span><button class="btn g x" data-del="sp_links:${i.id}">✕</button></div>`).join('')}
        <form class="add" data-add="link"><input name="titre" placeholder="Titre" required><input name="url" type="url" placeholder="https://…" required><button class="btn">+</button></form></div>
      <div class="box"><h4>Documents</h4>${files.map(i=>`<div class="li"><span class="t">📄 <a href="#" data-dl="${esc(i.path)}">${esc(i.nom)}</a> <small>· ${fd(i.created_at)}</small></span><button class="btn g x" data-deldoc="${i.id}" data-path="${esc(i.path)}">✕</button></div>`).join('')}
        <label class="btn" style="display:inline-block;margin-top:10px;color:inherit;font-size:14px">⬆ Ajouter des fichiers<input type="file" id="up" multiple hidden accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.csv,.zip"></label></div>
    </div>
    <div class="box feed"><h4>Journal</h4>
      <form class="add" data-add="update" style="margin:0 0 14px"><input name="contenu" placeholder="Point d'avancement, décision, remarque…" required><button class="btn p">Publier</button></form>
      ${u.data.map(i=>`<div class="it"><small>${esc(i.auteur)} · ${fdt(i.created_at)}</small><div>${esc(i.contenu)}</div></div>`).join('')||'<small style="color:var(--mut)">Aucune entrée</small>'}
    </div>
    <div><button class="btn d" id="delp">Supprimer le projet</button></div>
  </div>`;
  bind(x);
  if(GAL.length)gshow(0);
}
let GAL=[],gi=0;
function gshow(k){
  gi=(k+GAL.length)%GAL.length;const g=GAL[gi];
  const im=$('#gimg');if(im){im.src=g.url;im.style.animation='none';im.offsetHeight;im.style.animation='';}
  if($('#gcap'))$('#gcap').textContent=`${g.nom} · ${gi+1}/${GAL.length}`;
  document.querySelectorAll('.thumbs img').forEach((t,j)=>t.classList.toggle('on',j===gi));
  document.querySelector('.thumbs img.on')?.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'});
  if($('#lb').classList.contains('on'))$('#lbimg').src=g.url;
}
$('#lb').onclick=e=>{if(e.target.dataset.g)gshow(gi+ +e.target.dataset.g);else $('#lb').classList.remove('on')};
document.addEventListener('keydown',e=>{if(!GAL.length||!cur)return;if(e.key==='ArrowRight')gshow(gi+1);if(e.key==='ArrowLeft')gshow(gi-1);if(e.key==='Escape'&&$('#lb').classList.contains('on')){e.stopImmediatePropagation();$('#lb').classList.remove('on')}},true);
function close(){$('#detail').classList.remove('on');cur=null;GAL=[];history.replaceState(null,'',location.pathname);load()}
$('#detail').onclick=e=>{if(e.target.id==='detail')close()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&cur)close()});

let tmr;
async function patch(f,v){
  const {error}=await sb.from('sp_projects').update({[f]:v}).eq('id',cur);
  if(err(error))return;const s=$('#sv');s.classList.add('on');setTimeout(()=>s.classList.remove('on'),1200);
}
function bind(x){
  $('#cls').onclick=close;
  ['titre','synthese'].forEach(f=>$('#f_'+f).oninput=e=>{clearTimeout(tmr);tmr=setTimeout(()=>patch(f,e.target.value.trim()||(f==='titre'?'Sans titre':null)),600)});
  ['statut','priorite','echeance'].forEach(f=>$('#f_'+f).onchange=e=>patch(f,e.target.value||null));
  $('#f_avancement').oninput=e=>$('#av').textContent=e.target.value+'%';
  $('#f_avancement').onchange=e=>patch('avancement',+e.target.value);
  $('#delp').onclick=async()=>{
    if(!confirm('Supprimer définitivement ce projet ?'))return;
    const {data:docs}=await sb.from('sp_docs').select('path').eq('project_id',cur);
    if(docs?.length)await sb.storage.from('sp-docs').remove(docs.map(d=>d.path));
    if(!err((await sb.from('sp_projects').delete().eq('id',cur)).error))close();
  };
  $('#up').onchange=async e=>{
    for(const f of e.target.files){
      const path=`${cur}/${crypto.randomUUID()}-${f.name.replace(/[^\w.\-]/g,'_')}`;
      const up=await sb.storage.from('sp-docs').upload(path,f);
      if(err(up.error))continue;
      await sb.from('sp_docs').insert({project_id:cur,nom:f.name,path,taille:f.size});
    }
    toast('Fichiers ajoutés');open(cur);
  };
}
$('#panel').addEventListener('submit',async e=>{
  e.preventDefault();const f=Object.fromEntries(new FormData(e.target));for(const k in f)if(!f[k])delete f[k];
  const tb={task:'sp_tasks',link:'sp_links',update:'sp_updates'}[e.target.dataset.add];
  if(!err((await sb.from(tb).insert({...f,project_id:cur})).error))open(cur);
});
$('#panel').addEventListener('change',async e=>{
  const id=e.target.dataset.tk;if(!id)return;
  if(!err((await sb.from('sp_tasks').update({fait:e.target.checked}).eq('id',id)).error))open(cur);
});
$('#panel').addEventListener('click',async e=>{
  const t=e.target;
  if(t.dataset.g)return gshow(gi+ +t.dataset.g);
  if(t.dataset.gi)return gshow(+t.dataset.gi);
  if(t.id==='gimg'){$('#lbimg').src=GAL[gi].url;$('#lb').classList.add('on');return}
  if(t.id==='gdel'){const g=GAL[gi];if(!confirm('Supprimer cette image ?'))return;await sb.storage.from('sp-docs').remove([g.path]);if(!err((await sb.from('sp_docs').delete().eq('id',g.id)).error))open(cur);return}
  if(t.dataset.del){const [tb,id]=t.dataset.del.split(':');if(!err((await sb.from(tb).delete().eq('id',id)).error))open(cur)}
  if(t.dataset.deldoc){if(!confirm('Supprimer ce document ?'))return;await sb.storage.from('sp-docs').remove([t.dataset.path]);if(!err((await sb.from('sp_docs').delete().eq('id',t.dataset.deldoc)).error))open(cur)}
  if(t.dataset.dl){e.preventDefault();const {data,error}=await sb.storage.from('sp-docs').createSignedUrl(t.dataset.dl,120);if(!err(error))window.open(data.signedUrl,'_blank','noopener')}
});
</script>
</body>
</html>
